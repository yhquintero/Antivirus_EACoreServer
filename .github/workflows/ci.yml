name: Validación

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas en ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Sin fail-fast: los tres sistemas deben reportar su resultado, aunque uno
      # falle, para saber exactamente dónde se rompe la compatibilidad.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Mostrar plataforma detectada
        run: python -c "import usb_monitor; print('Plataforma:', usb_monitor.NOMBRE_PLATAFORMA, '| Windows:', usb_monitor.ES_WINDOWS, '| macOS:', usb_monitor.ES_MACOS, '| Linux:', usb_monitor.ES_LINUX)"

      # py_compile solo valida sintaxis y no importa los módulos, por eso
      # usb_monitor_windows.py (que requiere pywin32) puede compilarse también
      # en Ubuntu y macOS.
      - name: Comprobar sintaxis
        run: python -m py_compile main.py gui.py logger.py process_manager.py repair_engine.py scraper.py usb_monitor.py usb_monitor_windows.py

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Verificar rutas únicas sin duplicados
        run: python -c "import scraper; r=scraper.obtener_rutas_por_defecto(); assert len(r)==52, len(r); assert len({x.lower() for x in r})==52; print('52 rutas únicas confirmadas')"
